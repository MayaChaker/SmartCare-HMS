<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartCare Private Hospital</title>
    <meta name="description" content="SmartCare Private Hospital, Beirut: leading specialists, private rooms and a personal coordinator for every patient." />

    <!-- Link previews (WhatsApp, LinkedIn, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SmartCare Private Hospital" />
    <meta property="og:title" content="SmartCare Private Hospital" />
    <meta property="og:description" content="Leading specialists, private rooms and a personal coordinator for every patient. A full-stack hospital system with patient, doctor, front desk and administration portals." />
    <meta property="og:image" content="https://smart-care-hms.vercel.app/images/site/corridor-1600.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Brand icon: SVG for modern browsers, .ico for older ones, PNG for phone home screens -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#16302b" />

    <!-- The hero photo is the first thing on screen: start downloading it with the page -->
    <link
      rel="preload"
      as="image"
      href="/images/site/corridor-800.webp"
      imagesrcset="/images/site/corridor-800.webp 800w, /images/site/corridor-1600.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Brand fonts: Cormorant Garamond for titles, DM Sans for text (set in src/styles/site.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #f7f3ec;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
